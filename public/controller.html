<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="ScareBooth">
  <meta name="theme-color" content="#070405">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="apple-touch-icon" href="/assets/icon-180.png">
  <link rel="icon" href="/assets/favicon.svg">
  <title>ScareBooth</title>
  <link rel="stylesheet" href="/css/theme.css">
  <link rel="stylesheet" href="/css/controller.css">
  <link rel="stylesheet" href="/css/romance.css">
</head>
<body class="grain ipad">
  <div class="vignette"></div>
  <div class="love" id="love"></div>
  <div class="florals tl"></div><div class="florals tr"></div><div class="florals bl"></div><div class="florals br"></div>

  <main id="app">
    <!-- idle: pick a language (shown in both) -->
    <section id="s-idle" class="screen center">
      <div class="eyebrow" id="idleWelcome"></div>
      <h1 class="logo hero" data-title>Till Death Do Us Part</h1>
      <p class="type lead" data-th="lead"></p>
      <button class="btn huge lang-btn" data-action="begin" id="beginBtn" data-i18n="start"></button>
      <p class="type sub" id="idleNote"></p>
    </section>

    <!-- intro: how it works, then Start -->
    <section id="s-intro" class="screen center">
      <div class="intro-card">
        <div class="eyebrow red" data-i18n="howItWorks"></div>
        <div class="eye"><span></span></div>
        <h2 class="type look" data-i18n="readBigScreen"></h2>
        <p class="type sub" data-i18n="readyWhenYouAre"></p>
        <div class="row">
          <button class="btn ghost" data-action="back" data-i18n="back"></button>
          <button class="btn huge" data-action="start" id="startBtn" data-i18n="start"></button>
        </div>
        <p class="type sub offline-note" id="introNote"></p>
      </div>
    </section>

    <!-- warning -->
    <section id="s-warning" class="screen center">
      <div class="warn-card">
        <div class="warn-icon">!</div>
        <div class="eyebrow red" data-t="warnEyebrow"></div>
        <h2 class="type" data-i18n="warnTitle"></h2>
        <p id="warningText"></p>
        <div class="row">
          <button class="btn ghost" data-action="decline" data-i18n="noThanks"></button>
          <button class="btn" data-action="accept" data-i18n="iUnderstand"></button>
        </div>
      </div>
    </section>

    <!-- shooting -->
    <section id="s-shooting" class="screen center">
      <div class="eye"><span></span></div>
      <h2 class="type look" data-i18n="lookBig"></h2>
      <p class="type sub" data-i18n="lookBigSub"></p>
    </section>

    <!-- choose -->
    <section id="s-choose" class="screen choose">
      <header>
        <div class="eyebrow red" data-i18n="finalPhoto"></div>
        <h2 class="type" data-i18n="pickReaction"></h2>
        <p class="sub small choose-hint" data-i18n-html="pickHint"></p>
      </header>
      <div class="preview"><img id="chooseImg" alt="Selected reaction"></div>
      <div class="thumbs" id="thumbs"></div>
      <p class="msg" id="chooseMsg"></p>
      <div class="row">
        <button class="btn" id="confirmBtn" data-i18n="useThis"></button>
      </div>
      <p class="sub small" id="chooseTimer"></p>
    </section>

    <!-- composing -->
    <section id="s-composing" class="screen center">
      <div class="eye"><span></span></div>
      <h2 class="type look" data-i18n="developingIpad"></h2>
    </section>

    <!-- done -->
    <section id="s-done" class="screen center">
      <div class="eyebrow red" data-t="ipadDoneEyebrow"></div>
      <h2 class="logo donehead" id="doneHead" data-i18n="stripReady"></h2>
      <div id="printAsk" class="print-ask" hidden>
        <h3 class="type" data-i18n="howManyPrints"></h3>
        <p class="type print-each" id="printEach" hidden data-i18n="eachPrint2"></p>
        <div class="copies" id="copyBtns"></div>
      </div>
      <p class="type print-status" id="printStatus"></p>
      <div class="qrs" id="qrs">
        <div class="qr" id="qrWifiBox" hidden><div class="qr-img" id="qrWifi"></div><div class="qr-cap"><b>1</b> <span data-i18n="joinWifi"></span> <span id="qrWifiName"></span></div></div>
        <div class="qr" id="qrDlBox" hidden><div class="qr-img" id="qrDl"></div><div class="qr-cap"><b id="qrStep">2</b> <span data-i18n="scanDownload"></span><span id="qrNote"></span></div></div>
      </div>
      <button class="btn" data-action="finish" id="againBtn" data-i18n="newSession"></button>
      <p class="sub small" id="doneTimer"></p>
    </section>
  </main>

  <button id="cancelBtn" class="cancel" data-action="cancel" hidden>✕ Cancel session</button>
  <div id="status" class="pill"><span class="dot"></span><span id="statusText">Connecting…</span></div>
  <div id="toast"></div>

  <script src="/js/vendor/qrcode.js"></script>
  <script src="/js/common.js"></script>
  <script src="/js/controller.js"></script>
</body>
</html>
