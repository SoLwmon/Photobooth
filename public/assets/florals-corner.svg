<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 420 420" width="420" height="420">
  <!-- Original corner bouquet of red roses for the "Till Death Do Us Part" theme. Anchored to the top-left corner; mirror with CSS for other corners. -->
  <defs>
    <radialGradient id="petalOuter" cx="50%" cy="40%" r="70%">
      <stop offset="0" stop-color="#ff5a5f"/><stop offset="0.6" stop-color="#d4141e"/><stop offset="1" stop-color="#8b0a12"/>
    </radialGradient>
    <radialGradient id="petalMid" cx="50%" cy="40%" r="70%">
      <stop offset="0" stop-color="#e8323b"/><stop offset="0.7" stop-color="#b00d18"/><stop offset="1" stop-color="#6e0610"/>
    </radialGradient>
    <radialGradient id="petalCore" cx="50%" cy="50%" r="60%">
      <stop offset="0" stop-color="#4a0309"/><stop offset="1" stop-color="#9a0a15"/>
    </radialGradient>
    <radialGradient id="blushOuter" cx="50%" cy="40%" r="70%">
      <stop offset="0" stop-color="#ff7b7f"/><stop offset="0.6" stop-color="#e3222c"/><stop offset="1" stop-color="#a10b16"/>
    </radialGradient>
    <linearGradient id="leaf" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#9ccc65"/><stop offset="1" stop-color="#558b2f"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#3a0306" flood-opacity="0.28"/></filter>

    <g id="rose">
      <g fill="url(#petalOuter)" stroke="#6e0610" stroke-width="1.2" stroke-opacity="0.5">
        <ellipse cx="0" cy="-30" rx="26" ry="22"/>
        <ellipse cx="0" cy="-30" rx="26" ry="22" transform="rotate(72)"/>
        <ellipse cx="0" cy="-30" rx="26" ry="22" transform="rotate(144)"/>
        <ellipse cx="0" cy="-30" rx="26" ry="22" transform="rotate(216)"/>
        <ellipse cx="0" cy="-30" rx="26" ry="22" transform="rotate(288)"/>
      </g>
      <g fill="url(#petalMid)" stroke="#4a0309" stroke-width="1" stroke-opacity="0.5">
        <ellipse cx="0" cy="-17" rx="18" ry="15" transform="rotate(36)"/>
        <ellipse cx="0" cy="-17" rx="18" ry="15" transform="rotate(108)"/>
        <ellipse cx="0" cy="-17" rx="18" ry="15" transform="rotate(180)"/>
        <ellipse cx="0" cy="-17" rx="18" ry="15" transform="rotate(252)"/>
        <ellipse cx="0" cy="-17" rx="18" ry="15" transform="rotate(324)"/>
      </g>
      <circle r="13" fill="url(#petalCore)"/>
      <path d="M-8,2 C-10,-8 2,-12 7,-5 C11,1 4,8 -2,5 C-6,3 -4,-3 0,-3" fill="none" stroke="#ff6b70" stroke-width="2" stroke-linecap="round" opacity="0.8"/>
    </g>
    <g id="blushRose">
      <g fill="url(#blushOuter)" stroke="#7a0811" stroke-width="1.2" stroke-opacity="0.6">
        <ellipse cx="0" cy="-24" rx="21" ry="18"/>
        <ellipse cx="0" cy="-24" rx="21" ry="18" transform="rotate(72)"/>
        <ellipse cx="0" cy="-24" rx="21" ry="18" transform="rotate(144)"/>
        <ellipse cx="0" cy="-24" rx="21" ry="18" transform="rotate(216)"/>
        <ellipse cx="0" cy="-24" rx="21" ry="18" transform="rotate(288)"/>
      </g>
      <circle r="12" fill="#7a0811" stroke="#7a0811" stroke-opacity="0.6"/>
      <path d="M-6,2 C-8,-6 2,-9 5,-4 C8,1 3,6 -1,4" fill="none" stroke="#ff5a5f" stroke-width="2" stroke-linecap="round"/>
    </g>
    <path id="leafShape" d="M0,0 C18,-16 52,-18 74,0 C52,18 18,16 0,0 Z"/>
    <path id="heart" d="M0,6 C-2,2 -9,-1 -9,-6 C-9,-10 -5,-12 -2.5,-11 C-1,-10.5 0,-9 0,-8 C0,-9 1,-10.5 2.5,-11 C5,-12 9,-10 9,-6 C9,-1 2,2 0,6 Z"/>
  </defs>

  <g filter="url(#soft)">
    <!-- leaves -->
    <g fill="url(#leaf)">
      <use href="#leafShape" xlink:href="#leafShape" transform="translate(150,40) rotate(10)"/>
      <use href="#leafShape" xlink:href="#leafShape" transform="translate(60,150) rotate(80)"/>
      <use href="#leafShape" xlink:href="#leafShape" transform="translate(185,120) rotate(35) scale(0.9)"/>
      <use href="#leafShape" xlink:href="#leafShape" transform="translate(120,175) rotate(60) scale(0.85)"/>
      <use href="#leafShape" xlink:href="#leafShape" transform="translate(250,30) rotate(-5) scale(0.8)"/>
      <use href="#leafShape" xlink:href="#leafShape" transform="translate(30,250) rotate(95) scale(0.8)"/>
    </g>
    <g stroke="#3f6b1f" stroke-width="1.4" fill="none" opacity="0.6">
      <path d="M152,40 l70,12"/><path d="M60,152 l14,72"/><path d="M187,121 l55,40"/>
    </g>
    <!-- vine with buds -->
    <path d="M10,10 C120,40 230,30 330,18" fill="none" stroke="#7cb342" stroke-width="3"/>
    <path d="M10,10 C40,120 30,230 18,330" fill="none" stroke="#7cb342" stroke-width="3"/>
    <g fill="#b00d18">
      <ellipse cx="300" cy="16" rx="7" ry="10" transform="rotate(70 300 16)"/>
      <ellipse cx="335" cy="20" rx="5" ry="8" transform="rotate(80 335 20)"/>
      <ellipse cx="16" cy="300" rx="10" ry="7" transform="rotate(20 16 300)"/>
      <ellipse cx="20" cy="335" rx="8" ry="5" transform="rotate(10 20 335)"/>
    </g>
    <!-- roses -->
    <use href="#rose" xlink:href="#rose" transform="translate(70,70) scale(1.55)"/>
    <use href="#blushRose" xlink:href="#blushRose" transform="translate(165,62) scale(1.15)"/>
    <use href="#blushRose" xlink:href="#blushRose" transform="translate(58,168) scale(1.1) rotate(30)"/>
    <use href="#rose" xlink:href="#rose" transform="translate(140,140) scale(0.95) rotate(20)"/>
    <use href="#rose" xlink:href="#rose" transform="translate(235,52) scale(0.7) rotate(40)"/>
    <use href="#rose" xlink:href="#rose" transform="translate(48,240) scale(0.7) rotate(10)"/>
    <!-- baby's breath -->
    <g fill="#ffffff" opacity="0.95">
      <circle cx="210" cy="95" r="4"/><circle cx="220" cy="105" r="3"/><circle cx="200" cy="108" r="3"/>
      <circle cx="98" cy="210" r="4"/><circle cx="108" cy="222" r="3"/><circle cx="90" cy="226" r="3"/>
      <circle cx="275" cy="60" r="3"/><circle cx="62" cy="282" r="3"/>
    </g>
    <!-- little hearts -->
    <g fill="#c8101e" opacity="0.85">
      <use href="#heart" xlink:href="#heart" transform="translate(215,150) scale(1.2) rotate(-12)"/>
      <use href="#heart" xlink:href="#heart" transform="translate(150,215) scale(1) rotate(10)"/>
      <use href="#heart" xlink:href="#heart" transform="translate(300,90) scale(0.8)"/>
      <use href="#heart" xlink:href="#heart" transform="translate(95,300) scale(0.8)"/>
    </g>
  </g>
</svg>
